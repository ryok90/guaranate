name: CI

on:
  pull_request:
    # Docs and repo/GitHub metadata never affect the Swift build, tests, or
    # smoke script. ci.yml itself is intentionally NOT ignored so a PR editing
    # the CI definition still validates it.
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - .gitignore
      - .github/dependabot.yml
      - .github/FUNDING.yml
      - .github/CODEOWNERS
      - .github/ISSUE_TEMPLATE/**
      - .github/workflows/codeql.yml
      - .github/workflows/changelog.yml
      - .github/workflows/release.yml
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode (Swift 6)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Print toolchain versions
        run: |
          swift --version
          xcodebuild -version

      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build (release)
        run: swift build -c release

      - name: Test
        run: swift test

      - name: E2E smoke test (assertion lifecycle)
        run: ./scripts/smoke.sh
