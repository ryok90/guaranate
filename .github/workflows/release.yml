name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & publish
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Build the exact tag being released (both push and manual dispatch).
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Select Xcode (Swift 6)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve tag and version
        id: vars
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          # The tag must already exist; releases never create or move tags.
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag does not exist. Create and push it before releasing."
            exit 1
          fi
          # Never publish a commit other than the tagged one.
          if [ "$(git rev-parse "refs/tags/$tag^{commit}")" != "$(git rev-parse HEAD)" ]; then
            echo "::error::Checked-out commit does not match tag $tag."
            exit 1
          fi
          # versionString is the single source of truth in the CLI.
          src_version="$(sed -n 's/.*versionString *= *"\([^"]*\)".*/\1/p' Sources/GuaranateCLI/Guaranate.swift)"
          echo "tag=$tag"                 >> "$GITHUB_OUTPUT"
          echo "version=$version"         >> "$GITHUB_OUTPUT"
          echo "src_version=$src_version" >> "$GITHUB_OUTPUT"
          if [ "$version" != "$src_version" ]; then
            echo "::error::Tag version ($version) does not match versionString in source ($src_version). Bump Guaranate.versionString before tagging."
            exit 1
          fi

      - name: Build universal release binary
        run: |
          swift build -c release --arch arm64 --arch x86_64
          bin="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/guaranate"
          echo "BIN=$bin" >> "$GITHUB_ENV"
          file "$bin"

      - name: Unit tests
        run: swift test

      - name: Smoke test
        run: ./scripts/smoke.sh "$BIN"

      - name: Package artifact
        id: package
        run: |
          version="${{ steps.vars.outputs.version }}"
          name="guaranate-${version}-macos-universal"
          mkdir -p "dist/$name"
          cp "$BIN" "dist/$name/guaranate"
          cp LICENSE README.md CHANGELOG.md "dist/$name/"
          tarball="${name}.tar.gz"
          tar -C dist -czf "$tarball" "$name"
          shasum -a 256 "$tarball" > "${tarball}.sha256"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          cat "${tarball}.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.vars.outputs.tag }}
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            "$TARBALL" "$TARBALL.sha256"
