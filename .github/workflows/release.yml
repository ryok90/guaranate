name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & publish
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (Swift 6)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve tag and version
        id: vars
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          # versionString is the single source of truth in the CLI.
          src_version="$(sed -n 's/.*versionString *= *"\([^"]*\)".*/\1/p' Sources/GuaranateCLI/Guaranate.swift)"
          echo "tag=$tag"                 >> "$GITHUB_OUTPUT"
          echo "version=$version"         >> "$GITHUB_OUTPUT"
          echo "src_version=$src_version" >> "$GITHUB_OUTPUT"
          if [ "$version" != "$src_version" ]; then
            echo "::error::Tag version ($version) does not match versionString in source ($src_version). Bump Guaranate.versionString before tagging."
            exit 1
          fi

      - name: Build universal release binary
        run: |
          swift build -c release --arch arm64 --arch x86_64
          bin="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/guaranate"
          echo "BIN=$bin" >> "$GITHUB_ENV"
          file "$bin"

      - name: Smoke test
        run: ./scripts/smoke.sh "$BIN"

      - name: Package artifact
        id: package
        run: |
          version="${{ steps.vars.outputs.version }}"
          name="guaranate-${version}-macos-universal"
          mkdir -p "dist/$name"
          cp "$BIN" "dist/$name/guaranate"
          cp LICENSE README.md CHANGELOG.md "dist/$name/"
          tarball="${name}.tar.gz"
          tar -C dist -czf "$tarball" "$name"
          shasum -a 256 "$tarball" > "${tarball}.sha256"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          cat "${tarball}.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.vars.outputs.tag }}
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          notes_flag=(--generate-notes)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git rev-parse "$TAG" >/dev/null 2>&1 || git tag "$TAG"
            git push origin "$TAG" || true
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            "${notes_flag[@]}" \
            "$TARBALL" "$TARBALL.sha256"
